<!-- @dsCard height=288 -->
<!doctype html>
<html><head><style>
  html, body { margin: 0; background: var(--ink); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--ink); }
  .cover svg { position: absolute; inset: 0; }
  .gold { fill: var(--gold); }
  .leaf { fill: var(--leaf); }
  .slab { fill: var(--bubble-user); }
  .cream { fill: var(--text); }
  .cut { fill: var(--ink); }
  .r { rx: var(--radius-bubble); }
  .name { position: absolute; left: 40px; bottom: 40px; max-width: 440px; }
  .name b { display: block; font-family: Fraunces, serif; font-weight: 680; font-size: 120px; line-height: .92; color: var(--text); font-variation-settings: 'opsz' 144; }
  .name span { display: block; margin-top: 16px; font-family: Outfit, sans-serif; font-size: 14px; color: var(--muted); }
</style></head>
<body>
<div class="cover">
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <!--
      blocks: gold 168×232 (radius-bubble), leaf 112×208, bubble-user slab 168×320, text (cream) 168×72 — gold leads, as in the mark and the send button.
      arrangement: staggered strip right of x=480 — leaf rises from the bottom, gold hangs from the top, cream sits under gold, the slab bleeds top/right/bottom.
      pattern: literal motif — the sabiá's wing as stacked quarter-circle feathers (gold on the slab, ink cut from gold); the bird mark is the brand's only figure.
      scales: feather radius 56 = space-28×2, feather gap space-16, block gaps space-16 (leaf→gold 0, gold→cream 16), corners radius-bubble 16.
    -->
    <rect class="leaf r" x="528" y="96" width="112" height="208"/>
    <rect class="gold r" x="640" y="-16" width="168" height="232"/>
    <rect class="cream r" x="640" y="232" width="168" height="72"/>
    <rect class="slab" x="808" y="-16" width="168" height="320"/>
    <path class="cut" d="M640 40 L696 40 A56 56 0 0 1 640 96 Z"/>
    <path class="cut" d="M640 112 L696 112 A56 56 0 0 1 640 168 Z"/>
    <path class="gold" d="M808 24 L864 24 A56 56 0 0 1 808 80 Z"/>
    <path class="gold" d="M808 96 L864 96 A56 56 0 0 1 808 152 Z"/>
    <path class="gold" d="M808 168 L864 168 A56 56 0 0 1 808 224 Z"/>
  </svg>
  <div class="name">
    <b>Sabiá</b>
    <span>português, no site e no Telegram</span>
  </div>
</div>
</body></html>
