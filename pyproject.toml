[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "consulta-em-foco"
version = "0.1.0"
description = "Pré-consulta, teleconsulta e documentos médicos com revisão profissional"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "cryptography>=44,<50", "argon2-cffi>=23,<26", "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1", "httpx>=0.27,<1", "reportlab>=4.2,<5",
  "pypdf>=5,<7", "pyHanko>=0.29,<1", "tzdata>=2024.1,<2028",
  "pillow>=11.1,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["consulta*"]

[tool.setuptools.package-data]
consulta = ["web/*", "fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
