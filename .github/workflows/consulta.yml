name: Consulta em Foco
on:
  push:
    branches: [main, "codex/consulta-em-foco"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q
        env:
          RUN_BROWSER_TESTS: "1"
