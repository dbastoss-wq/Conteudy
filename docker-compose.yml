services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secretaria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretaria}
      POSTGRES_DB: secretaria
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # só no loopback: o banco nunca fica exposto à internet
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretaria"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      # garante que o app fale com o container do banco, não com localhost
      DATABASE_URL: postgres://secretaria:${POSTGRES_PASSWORD:-secretaria}@db:5432/secretaria
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    ports:
      # acesso local; o tráfego público entra pelo Caddy (HTTPS)
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    # aplica migrações e sobe o servidor
    command: sh -c "node dist/db/migrate.js && node dist/server.js"

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
