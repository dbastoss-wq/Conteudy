services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secretaria
      POSTGRES_PASSWORD: secretaria
      POSTGRES_DB: secretaria
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretaria"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      # garante que o app fale com o container do banco, não com localhost
      DATABASE_URL: postgres://secretaria:secretaria@db:5432/secretaria
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    # aplica migrações e sobe o servidor
    command: sh -c "node dist/db/migrate.js && node dist/server.js"

volumes:
  pgdata:
